schema_version: 2
base_config: config.yaml
seed: 20261014
dataset: ../data/full_dataset
output_root: ../outputs/training
device: auto
arms:
- replay_csd
- control_priority
objective_config: ../configs/control.yaml
quality_weights:
  d50_um: 1.0
  span: 1.0
  concentration: 0.25
  yield_fraction: 0.0
auxiliary_loss:
  number: 0.05
  mass: 0.1
  log: 0.02
  change_scaled: 0.0
  concentration: 0.0
  inventory: 10.0
absolute_scale_mode: process
scale_floors:
  absolute:
    d50_um: 5.0
    span: 0.01
    concentration: 0.001
    yield_fraction: 0.005
  response:
    d50_um: 1.0e-06
    span: 1.0e-08
    concentration: 1.0e-09
    yield_fraction: 1.0e-08
response:
  weight: 0.5
  groups_per_update: 2
  mixture:
    short: 0.7
    long: 0.25
    terminal: 0.05
selection:
  horizons:
  - 1
  - 3
  - 10
  - 30
  origins:
  - 0
  - 10
  - 30
  - 60
  - 90
  - 120
  - 150
  - 170
  every_epochs: 2
  full_every_epochs: 5
  response_groups_per_parent: 6
  response_weight: 0.5
  terminal_weight: 0.25
  ranking_weight: 0.25
  tie_tolerance: 1.0e-06
profiles:
  smoke:
    train_per_family: 1
    validation_per_family: 1
    development_per_family: 1
    patience: 0
    stages:
    - horizon: 1
      epochs: 1
      updates_per_epoch: 2
      lr: 0.001
      full_terminal: false
    - horizon: 3
      epochs: 1
      updates_per_epoch: 2
      lr: 0.0005
      full_terminal: true
  pilot:
    train_per_family: 60
    validation_per_family: 15
    development_per_family: 15
    patience: 0
    stages:
    - horizon: 1
      epochs: 10
      updates_per_epoch: 50
      lr: 0.001
      full_terminal: false
    - horizon: 3
      epochs: 10
      updates_per_epoch: 50
      lr: 0.0005
      full_terminal: false
    - horizon: 10
      epochs: 10
      updates_per_epoch: 50
      lr: 0.0002
      full_terminal: false
  formal:
    train_per_family: 0
    validation_per_family: 0
    development_per_family: 20
    patience: 5
    stages:
    - horizon: 1
      epochs: 20
      updates_per_epoch: 100
      lr: 0.001
      full_terminal: false
    - horizon: 3
      epochs: 25
      updates_per_epoch: 100
      lr: 0.0005
      full_terminal: false
    - horizon: 10
      epochs: 30
      updates_per_epoch: 100
      lr: 0.0002
      full_terminal: false
    - horizon: 30
      epochs: 20
      updates_per_epoch: 50
      lr: 0.0001
      full_terminal: false
    - horizon: 30
      epochs: 10
      updates_per_epoch: 20
      lr: 5.0e-05
      full_terminal: true
evaluation:
  origins:
  - 0
  - 10
  - 60
  - 120
  response_horizons:
  - 1
  - 3
  - 10
  - 30
  direction_tolerance:
    d50_um: 1.0e-06
    span: 1.0e-08
    concentration: 1.0e-09
    yield_fraction: 1.0e-08
